<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPS Trade Show Countdown</title>

<link href="https://fonts.googleapis.com/css2?family=Rye&display=swap"
      rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Rye", Georgia, serif;
    text-align: center;
    background: transparent;
  }

  .wrapper {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 10px 8px;
  }

  #headline {
    display: flex;
    flex-wrap: nowrap;
    justify-content: center;
    align-items: center;
    gap: 12px;
    white-space: nowrap;
    font-size: clamp(10px, 2.2vw, 28px);
  }

  .headline-text {
    color: #3B1D0D;
  }

  #timer {
    display: inline-block;
    flex-shrink: 0;
    color: #A6381D;
    font-family: "Rye", Georgia, serif;
    font-size: inherit;
    white-space: nowrap;
  }

  .time-block {
    display: inline-block;
    white-space: nowrap;
  }

  .number {
    display: inline-block;
    min-width: 2ch;
    text-align: center;
  }
</style>
</head>

<body>
<div class="wrapper">
  <div id="headline">
    <span class="headline-text">2027 IPS Trade Show Begins In:</span>
    <span id="timer" role="timer"></span>
  </div>
</div>

<script>
  const timerEl = document.getElementById("timer");

  // Pacific Standard Time in January.
  const eventStart =
    new Date("2027-01-12T09:00:00-08:00").getTime();

  const eventEnd =
    new Date("2027-01-13T00:00:00-08:00").getTime();

  function updateCountdown() {
    const now = Date.now();

    if (now >= eventEnd) {
      timerEl.textContent = "Thanks for coming!";
      return;
    }

    if (now >= eventStart) {
      timerEl.textContent = "Happening Now!";
      return;
    }

    const distance = eventStart - now;

    const days = Math.floor(distance / 86400000);
    const hours = Math.floor(distance / 3600000) % 24;
    const minutes = Math.floor(distance / 60000) % 60;
    const seconds = Math.floor(distance / 1000) % 60;

    timerEl.innerHTML = `
      <span class="time-block"><span class="number">${days}</span>d</span>
      <span class="time-block"><span class="number">${String(hours).padStart(2, "0")}</span>h</span>
      <span class="time-block"><span class="number">${String(minutes).padStart(2, "0")}</span>m</span>
      <span class="time-block"><span class="number">${String(seconds).padStart(2, "0")}</span>s</span>
    `;
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>
</body>
</html>
